name: Validate TGC and Timeline

on:
  pull_request:
    paths:
      - ".github/workflows/validate-1966-extension.yml"
      - "AGENTS.md"
      - ".gitignore"
      - "README.md"
      - "*.mod"
      - "tools/tests/**"
      - "TGC/**"
      - "TGC_Timeline_1966/**"
  push:
    paths:
      - ".github/workflows/validate-1966-extension.yml"
      - "AGENTS.md"
      - ".gitignore"
      - "README.md"
      - "*.mod"
      - "tools/tests/**"
      - "TGC/**"
      - "TGC_Timeline_1966/**"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional git ref/SHA to compare drift checks against; defaults to HEAD~1"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-1966-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run tooling and content regressions
        run: python -B -m unittest discover -s tools/tests -v

      - name: Determine drift base ref
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$(git merge-base HEAD "$PR_BASE_SHA")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base_ref="$BEFORE_SHA"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
              echo "Push base $BEFORE_SHA is unavailable. Run this workflow manually with a verified base ref." >&2
              exit 1
            else
              base_ref="$(git rev-parse HEAD~1)"
            fi
          else
            if [[ -n "$INPUT_BASE_REF" ]]; then
              base_ref="$INPUT_BASE_REF"
            else
              base_ref="$(git rev-parse HEAD~1)"
            fi
          fi

          base_ref="$(git rev-parse --verify --end-of-options "${base_ref}^{commit}")"
          echo "BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "Using drift BASE_REF=$base_ref"

      - name: Run 1966 submod drift check (core to submod)
        if: ${{ !cancelled() && env.BASE_REF != '' }}
        run: python TGC/tools/check_1966_submod_drift.py --base-ref "$BASE_REF" --fail-on-warn

      - name: Run 1966 submod drift check (submod to core)
        if: ${{ !cancelled() && env.BASE_REF != '' }}
        run: python TGC/tools/check_1966_submod_drift.py --reverse --base-ref "$BASE_REF" --fail-on-warn

      - name: Run 1966 extension validator
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python TGC/tools/validate_1966_extension.py

      - name: Run 1966 balance audit
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python TGC/tools/audit_1966_balance.py --summary
